[package]
name = "trove-core"
description = "Trove's domain logic: types, validation, layout solver and ports. Does no IO and knows nothing about Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["serde", "v7"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
