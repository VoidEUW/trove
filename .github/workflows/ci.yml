name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Job names are the required status checks in the `protect-main` ruleset: keep them in sync.
jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # The frontend is built first: the Tauri crate embeds apps/desktop/build at compile time.
      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Runs the tests and measures line coverage; the thresholds are in tools/quality/thresholds.json (ADR 17).
      - name: Test and coverage
        run: cargo llvm-cov --workspace --json --output-path coverage.json

      - name: Coverage thresholds
        run: node tools/quality/check.mjs coverage coverage.json

      # `cargo test` writes the TypeScript bindings (ADR 4); a difference means they were not regenerated.
      - name: Bindings are up to date
        run: |
          changed=$(git status --porcelain -- apps/desktop/src/lib/bindings)
          if [ -n "$changed" ]; then
            echo "Stale bindings: run cargo test and commit apps/desktop/src/lib/bindings"
            echo "$changed"
            exit 1
          fi

      # Components go through apps/desktop/src/lib/api/ and never talk to Tauri themselves (ADR 4).
      - name: Only the API layer imports Tauri
        run: |
          offenders=$(grep -rlE "@tauri-apps/api" apps/desktop/src --include='*.svelte' --include='*.ts' | grep -v '^apps/desktop/src/lib/api/' || true)
          if [ -n "$offenders" ]; then
            echo "Only apps/desktop/src/lib/api/ may import @tauri-apps/api:"
            echo "$offenders"
            exit 1
          fi

  # Thresholds can be raised but not lowered: compare with the branch the pull request targets.
  ratchet:
    name: ratchet
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node tools/quality/check.mjs ratchet origin/${{ github.base_ref }}

  # Reports only for now: it is not a required check (ADR 17). #92 closes the gaps it finds, then it becomes required.
  mutation:
    name: mutation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutate the changed lines
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          for crate in trove-core trove-store; do
            # Exit codes 2 and 3 only say that mutants were missed or timed out; the score is checked below.
            code=0
            cargo mutants --in-diff pr.diff -p "$crate" -o "mutants-$crate" || code=$?
            case $code in 0|2|3) ;; *) exit "$code" ;; esac
          done
          for crate in trove-core trove-store; do
            # cargo-mutants writes nothing when the diff changes no Rust source.
            if [ -f "mutants-$crate/mutants.out/outcomes.json" ]; then
              node tools/quality/check.mjs mutation "$crate" "mutants-$crate/mutants.out/outcomes.json"
            else
              echo "$crate: no mutants in this diff"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants
          path: mutants-*/mutants.out

  # The built UI in Chromium against a stand-in for the Rust side, plus an accessibility check (ADR 17, tier 3).
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        working-directory: apps/desktop
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke tests
        working-directory: apps/desktop
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/desktop/test-results

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
