name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Job names are the required status checks in the `protect-main` ruleset: keep them in sync.
jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The frontend is built first: the Tauri crate embeds apps/desktop/build at compile time.
      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm run build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # `cargo test` writes the TypeScript bindings (ADR 4); a difference means they were not regenerated.
      - name: Bindings are up to date
        run: |
          changed=$(git status --porcelain -- apps/desktop/src/lib/bindings)
          if [ -n "$changed" ]; then
            echo "Stale bindings: run cargo test and commit apps/desktop/src/lib/bindings"
            echo "$changed"
            exit 1
          fi

      # Components go through apps/desktop/src/lib/api/ and never talk to Tauri themselves (ADR 4).
      - name: Only the API layer imports Tauri
        run: |
          offenders=$(grep -rlE "@tauri-apps/api" apps/desktop/src --include='*.svelte' --include='*.ts' | grep -v '^apps/desktop/src/lib/api/' || true)
          if [ -n "$offenders" ]; then
            echo "Only apps/desktop/src/lib/api/ may import @tauri-apps/api:"
            echo "$offenders"
            exit 1
          fi

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
