version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [chore]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    labels: [chore]
    commit-message:
      prefix: chore
      include: scope
    # adapter-static 4 requires SvelteKit 3, so raising them apart leaves two pull requests that
    # can never merge. They are raised together instead (#108).
    groups:
      sveltekit:
        applies-to: version-updates
        patterns:
          - "@sveltejs/kit"
          - "@sveltejs/adapter-static"
          - "@sveltejs/vite-plugin-svelte"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [chore]
    commit-message:
      prefix: ci
